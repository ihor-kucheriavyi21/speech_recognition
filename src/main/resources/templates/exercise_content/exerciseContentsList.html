<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ua">
<head>
    <title>Exercise contents List</title>
    <meta th:insert="fragments/header :: header">
    <style>
        .exercise-card {
            border-radius: 12px;
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .exercise-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .card-title {
            font-size: 1.1rem;
        }

    </style>
</head>
<body>
<div th:insert="fragments/navbar :: navbar">
</div>

<div class="container py-4">

    <div class="text-center mb-4">
        <h1 class="display-5 fw-bold" th:text="#{material_for_study}"></h1>
        <p class="text-muted" th:text="#{displayed_exercise_content}"></p>
    </div>

    <!-- LIST OF EXERCISE CARDS -->
    <div class="row g-4">

        <div class="col-md-6 col-lg-4"
             th:each="item : ${ExerciseContentsList}">

            <div class="card shadow-sm exercise-card h-100">

                <div class="card-body">

                    <!-- Title -->
                    <h5 class="card-title fw-bold" th:text="${item.questionText}"></h5>

                    <!-- Type -->
                    <span class="badge bg-primary mb-2" th:text="${item.typeContent}"></span>

                    <!-- Open button -->
                    <a th:href="@{'/exercise-content/' + ${item.id}}"
                       class="btn btn-outline-primary w-100 mt-3">
                        <i class="bi bi-box-arrow-in-right"></i>
                        Відкрити
                    </a>

                </div>
            </div>

        </div>
    </div>

    <!-- Add new -->
    <div class="text-center my-5">
        <a class="btn btn-success btn-lg"
           th:href="@{/exercise-content/create/page}">
            <i class="bi bi-plus-circle"></i>
            Додати новий навчальний матеріал
        </a>
    </div>

</div>

<div th:insert="fragments/footer :: footer"></div>
</body>
</html>
