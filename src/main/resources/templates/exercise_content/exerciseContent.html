<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta th:insert="fragments/header :: header"/>
    <title>Exercise</title>

    <style>
        .task-container {
            width: 70%;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        .question {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .answers {
            margin-top: 20px;
        }

        .answer-option {
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            transition: 0.2s;
        }

        .answer-option:hover {
            background: #f5f5f5;
            cursor: pointer;
        }

        .check-btn {
            margin-top: 20px;
            padding: 12px 28px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }

        .check-btn:hover {
            background: #23913d;
        }

        .result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
        }

        .correct {
            color: #28a745;
        }

        .incorrect {
            color: #d82e2e;
        }

    </style>
</head>

<body>
<div th:insert="fragments/navbar :: navbar">
</div>

<div class="task-container">

    <!-- QUESTION TEXT -->
    <div class="question" th:text="${exercise.questionText}"></div>
    <!-- IMAGE (якщо існує) -->
    <div th:if="${exercise.imageFileId != null}" style="text-align: center; margin-bottom: 20px;">
        <img th:src="@{'/exercise-content/image/' + ${exercise.imageFileId}}"
             style="max-width: 100%; max-height: 400px; border-radius: 8px;">
    </div>
    <!-- ANSWERS -->
    <form method="post" action="/exercise-content/check">
        <input type="hidden" name="id" th:value="${exercise.id}"/>

        <div class="answers">
            <div th:each="answer, iterStat : ${exercise.answers}" class="answer-option">
                <label>
                    <input type="radio"
                           name="selectedAnswer"
                           th:value="${iterStat.index}"
                           th:checked="${selectedAnswer == iterStat.index}">
                    <span th:text="${answer}"></span>
                </label>
            </div>
        </div>

        <button type="submit" class="check-btn">Перевірити</button>
    </form>

    <!-- RESULT -->
    <div class="result"
         th:if="${isCorrect != null}"
         th:classappend="${isCorrect} ? ' correct' : ' incorrect'"
         th:text="${isCorrect} ? 'Правильно!' : 'Неправильно. Спробуйте ще раз.'">
    </div>
    <!-- AI Hint -->
    <div th:if="${aiHint != null}"
         style="margin-top: 25px; padding: 20px; border-left: 5px solid #3f51b5; background: #f0f3ff; border-radius: 8px;">
        <h4 style="color:#3f51b5; font-weight: bold;">Підказка від AI</h4>
        <p th:text="${aiHint}" style="font-size: 18px;"></p>
    </div>


</div>

</body>
</html>
